name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  browser:
    name: Browsertests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  schema:
    name: Databaseschema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # Draait supabase/schema.sql tegen een echte Postgres: past het toe,
      # controleert of de publieke sleutel precies deze reis mag schrijven,
      # en of het opnieuw draaien veilig is.
      - name: schema toepassen en controleren
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: tests/schema/run.sh
