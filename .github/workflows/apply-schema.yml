name: Supabase-schema toepassen

# Draait automatisch zodra supabase/schema.sql verandert op main, en is
# daarnaast met de hand te starten (Actions-tab → deze workflow → Run
# workflow) — handig om het schema toe te passen zonder er zelf iets voor
# te wijzigen, bijvoorbeeld direct nadat het SUPABASE_DB_URL-secret gezet is.
#
# schema.sql is met opzet idempotent en controleert zichzelf (zie het
# script): dit faalt luid als er iets misgaat, het laat nooit een tabel
# half ingericht achter.
on:
  push:
    branches: [main]
    paths: ["supabase/schema.sql"]
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: psql installeren
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Schema toepassen op productie
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PGURL" ]; then
            echo "::error::Secret SUPABASE_DB_URL ontbreekt. Zie README.md, kopje" \
                 "'Gedeelde paklijst (Supabase)' → 'Schema automatisch toepassen'."
            exit 1
          fi
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
